services:
  - type: web
    name: email-impact-studio
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: BASE_URL
        sync: false
