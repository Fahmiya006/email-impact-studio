# Render Blueprint: push this repository to GitHub, then in Render choose New > Blueprint and select it.
# A persistent disk (needed to keep accounts and history) requires a paid instance type.
services:
  - type: web
    name: email-impact-studio
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: BASE_URL
        sync: false          # enter your public address, e.g. https://email-impact-studio.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
